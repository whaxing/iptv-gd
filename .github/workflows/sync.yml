name: Sync Guangdong IPTV M3U Auto Replace
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 下载源文件并替换链接
        run: |
          # 下载上游m3u，下载失败直接终止流程
          set -e
          SOURCE_URL="https://raw.githubusercontent.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List/refs/heads/master/GuangdongIPTV_rtp_all.m3u"
          curl -L --connect-timeout 15 -o source.m3u "$SOURCE_URL"
          
          # 校验文件是否下载成功、非空
          if [ ! -s source.m3u ]; then
            echo "源文件下载失败或为空，退出"
            exit 1
          fi

          # 替换 rtp:// → http://192.168.6.1:4022/udp/
          sed 's|rtp://|http://192.168.6.1:4022/udp/|g' source.m3u > GuangdongIPTV_modified.m3u

          # 输出文件大小用于排查
          ls -lh
          cat GuangdongIPTV_modified.m3u | head -10

      - name: 配置Git账号
        run: |
          git config user.name "IPTV Bot"
          git config user.email "bot@github.com"

      - name: 提交推送文件
        run: |
          git add GuangdongIPTV_modified.m3u
          # 无变更则跳过提交
          if git diff --cached --quiet; then
            echo "内容无更新，无需推送"
            exit 0
          fi
          git commit -m "自动同步更新 $(date '+%Y-%m-%d %H:%M')"
          git push
