name: Sync IPTV M3U Replace RTP
on:
  schedule:
    # 每6小时自动同步
    - cron: '0 */6 * * *'
  # 支持手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 下载上游原始m3u文件 + 全局文本替换
      - name: Download & Modify M3U File
        run: |
          # 拉取官方源文件
          curl -fsSL https://raw.githubusercontent.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List/master/GuangdongIPTV_rtp_all.m3u -o raw.m3u
          # 替换：rtp:// → http://192.168.6.1:4022/udp/
          sed 's|rtp://|http://192.168.6.1:4022/udp|g' raw.m3u > GuangdongIPTV_all.m3u
          # 删除临时原文件
          rm -f raw.m3u

      # 3. 配置git用户信息
      - name: Set up Git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # 4. 检测文件变化，有更新就提交推送
      - name: Commit and Push Changes
        run: |
          git add GuangdongIPTV_modified.m3u
          # 判断是否有文件改动，无改动直接退出不提交
          if git diff --cached --quiet; then
            echo "No updates found, skip push"
            exit 0
          fi
          git commit -m "Auto update IPTV list: $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main
